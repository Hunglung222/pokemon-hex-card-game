<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>寶可夢六角蜂巢卡牌遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta name="theme-color" content="#7c3aed">
    <style>
        body { margin: 0; font-family: 'Microsoft JhengHei', sans-serif; background: #0f172a; }
        #loading-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1e1b4b, #312e81); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div style="font-size:64px; margin-bottom:16px; animation:spin 2s linear infinite;">⬡</div>
        <div style="font-size:22px; font-weight:900; color:#c4b5fd; margin-bottom:8px;">寶可夢六角蜂巢卡牌</div>
        <div style="font-size:13px; color:#a78bfa; margin-bottom:24px;" id="loading-msg">正在載入模組...</div>
        <div style="width:200px; height:6px; background:#4c1d95; border-radius:99px; overflow:hidden;">
            <div id="loading-bar" style="height:100%; background:#8b5cf6; border-radius:99px; width:0%; transition:width 0.3s ease;"></div>
        </div>
    </div>
    <div id="root" style="display:none;"></div>

    <script src="js/globals.js"></script>
    <script>
    (function() {
        var FILES = [
            'js/hex-battle.js',
            'js/hex-tower.js',
            'js/forge-workshop.js',
            'js/app.js'
        ];
        var bar = document.getElementById('loading-bar');
        var msg = document.getElementById('loading-msg');
        var loaded = 0;
        var total = FILES.length;
        var contents = new Array(total);

        function fetchFile(url, idx) {
            return fetch(url + '?v=' + (window.APP_VERSION || '1.0'))
                .then(function(r) {
                    if (!r.ok) throw new Error('載入失敗: ' + url);
                    return r.text();
                })
                .then(function(text) {
                    contents[idx] = '\n// ===== ' + url + ' =====\n' + text;
                    loaded++;
                    if (msg) msg.textContent = '正在載入... (' + loaded + '/' + total + ')';
                    if (bar) bar.style.width = Math.round((loaded / total) * 90) + '%';
                });
        }

        Promise.all(FILES.map(function(url, idx) { return fetchFile(url, idx); }))
            .then(function() {
                if (msg) msg.textContent = '正在編譯 React...';
                if (bar) bar.style.width = '95%';
                try {
                    var bigCode = contents.join('\n');
                    var transformed = window.Babel.transform(bigCode, {
                        presets: [['react', { runtime: 'classic' }]],
                        sourceType: 'script',
                        filename: 'hex-bundle.jsx'
                    }).code;
                    if (bar) bar.style.width = '98%';
                    if (msg) msg.textContent = '正在啟動...';
                    var script = document.createElement('script');
                    script.textContent = transformed;
                    document.body.appendChild(script);
                    setTimeout(function() {
                        document.getElementById('loading-screen').style.display = 'none';
                        document.getElementById('root').style.display = '';
                    }, 200);
                } catch (e) {
                    console.error(e);
                    if (msg) msg.textContent = '編譯失敗: ' + e.message;
                }
            })
            .catch(function(err) {
                console.error(err);
                if (msg) msg.textContent = '載入失敗: ' + err.message;
            });
    })();
    </script>
</body>
</html>
